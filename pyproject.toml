[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxneuro-method"
version = "2.0.0"
description = "Minimal subject-level Grassmann–Euclidean learning and G-SMOTE implementation for repeated Parkinsonian speech"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Laiba Khan"},
  {name = "Manas Waghe"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "imbalanced-learn>=0.11"
]

[project.scripts]
voxneuro = "voxneuro.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
